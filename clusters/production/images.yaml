# Automação de imagem: o que faz este fluxo ser pull-based de verdade.
#
# Sem isto, o CI da aplicação teria de escrever neste repositório para mudar a
# tag -- o que exige um token de escrita em cada repo de app e devolve o
# acoplamento que o Flux existe para remover. Com isto, o repo da aplicação só
# publica a imagem; quem descobre a tag nova e commita é o cluster.
#
# A credencial de escrita no git já existe: é a deploy key que o
# `flux bootstrap` criou. Nenhum segredo novo.
#
# O registry é o ECR (532295959828.dkr.ecr.us-east-1.amazonaws.com), privado.
# Por isso o ImageRepository (em image-policies.yaml) leva um
# `secretRef: ecr-registry`, e os pods levam `imagePullSecrets` com o mesmo
# secret: um para o scan das tags, outro para o pull da imagem, o mesmo
# objeto. O token do ECR dura 12h e quem o renova é o CronJob em
# infrastructure/ecr-refresh.yaml, de 8 em 8 horas, dentro do cluster.
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageUpdateAutomation
metadata:
  name: zisp
  namespace: flux-system
spec:
  interval: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  git:
    checkout:
      ref: { branch: main }
    commit:
      author:
        name: flux
        email: flux@zisp.com.br
      messageTemplate: |
        chore: atualiza imagens

        {{ range .Changed.Changes }}{{ .OldValue }} -> {{ .NewValue }}
        {{ end }}
    push: { branch: main }
  update:
    path: ./
    strategy: Setters
