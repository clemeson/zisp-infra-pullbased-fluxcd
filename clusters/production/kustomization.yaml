# A Kustomization `flux-system` (gotk-sync.yaml) tem `path: ./clusters/production`,
# e o kustomize respeita um kustomization.yaml explícito quando ele existe. Ou
# seja: o que NÃO estiver listado aqui o Flux não aplica.
#
# `flux-system` precisa estar na lista, senão o Flux deixa de se gerenciar. Era
# o caso até 03/11/2026: o gotk-components.yaml estava correto em git, com os
# seis controllers, mas ficava FORA do build -- os controllers existiam no
# cluster só porque o `flux bootstrap` os aplicou direto, e um upgrade de Flux
# exigiria rodar o bootstrap outra vez em vez de ser um commit aqui.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - flux-system
  - cert-manager.yaml
  - infrastructure.yaml
  - apps.yaml
  - images.yaml
  - image-policies.yaml
