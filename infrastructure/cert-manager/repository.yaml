# Fontes Helm de terceiros. Separadas dos HelmRelease que as usam para ficar
# evidente, num arquivo só, tudo que este cluster baixa de fora.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: jetstack
  namespace: flux-system
spec:
  interval: 24h
  url: https://charts.jetstack.io
