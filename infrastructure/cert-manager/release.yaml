apiVersion: v1
kind: Namespace
metadata:
  name: cert-manager
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  interval: 1h
  chart:
    spec:
      chart: cert-manager
      # Versão fixa, não um range: upgrade de CRD é evento que se escolhe,
      # não que acontece sozinho numa reconciliação de madrugada.
      version: v1.21.2
      sourceRef:
        kind: HelmRepository
        name: jetstack
        namespace: flux-system
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  values:
    crds:
      enabled: true
    # Nó único de 2 vCPU: sem requests os pods ficam BestEffort e são os
    # primeiros despejados sob pressão -- justamente o controller que renova
    # os certificados.
    resources:
      requests: { cpu: 10m, memory: 64Mi }
      limits: { cpu: 200m, memory: 192Mi }
    webhook:
      resources:
        requests: { cpu: 10m, memory: 48Mi }
        limits: { cpu: 100m, memory: 128Mi }
    cainjector:
      resources:
        requests: { cpu: 10m, memory: 96Mi }
        limits: { cpu: 100m, memory: 256Mi }
