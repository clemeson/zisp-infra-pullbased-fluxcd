# Backup do /etc/ppp/chap-secrets para o S3.
#
# É o único estado do cluster que não está nem no git nem no Supabase: a base
# de usuários que o xl2tpd consulta para autenticar cada Mikrotik. Ele é
# derivado da tabela vpn_clients, e a conciliação do zisp-vpn-api o reconstrói
# -- mas de 6 em 6 horas, e só se o banco estiver de pé. Entre o momento em
# que o arquivo se perde e a próxima conciliação, nenhum CPE autentica.
#
# Dump horário, não diário: o arquivo muda a cada cliente novo, é minúsculo, e
# o custo de perder uma hora de cadastros é maior que o de guardar 24 cópias
# por dia de um arquivo de alguns KB.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup-chap-secrets
  namespace: zisp
spec:
  schedule: "17 * * * *"
  timeZone: America/Sao_Paulo
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: upload
              image: ghcr.io/clemeson/zisp-backup:latest # {"$imagepolicy": "flux-system:zisp-backup"}
              envFrom:
                - configMapRef: { name: backup-config }
                - secretRef: { name: aws-backup-credentials }
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  SRC=/host/chap-secrets
                  [ -s "$SRC" ] || { echo "chap-secrets vazio ou ausente" >&2; exit 1; }

                  # Cópia "latest" sobrescrita + uma por hora. A latest é a que
                  # se usa num restore (um comando, sem procurar); as datadas
                  # existem porque o modo mais provável de perder usuários não
                  # é o disco morrer, é uma conciliação ruim reescrever o
                  # arquivo -- e aí você precisa de ONTEM, não do mais recente.
                  aws s3 cp "$SRC" "s3://${S3_BUCKET}/vpn/chap-secrets.latest"
                  aws s3 cp "$SRC" \
                    "s3://${S3_BUCKET}/vpn/history/$(date +%Y/%m/%d)/chap-secrets-$(date +%H%M).txt"
                  echo "ok: $(wc -l < "$SRC") linhas"
              volumeMounts:
                - name: chap-secrets
                  mountPath: /host/chap-secrets
                  readOnly: true
              resources:
                requests: { cpu: 20m, memory: 32Mi }
                limits: { cpu: 100m, memory: 64Mi }
          volumes:
            # hostPath é correto aqui, não concessão: o arquivo pertence ao
            # pppd do host, que não roda em container. Nó único, então não há
            # ambiguidade sobre qual host.
            - name: chap-secrets
              hostPath:
                path: /etc/ppp/chap-secrets
                type: File
