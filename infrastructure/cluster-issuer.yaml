# O ClusterIssuer depende dos CRDs do cert-manager. A Kustomization
# infrastructure só reconcilia após cert-manager ficar Ready.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: clemeson@zisp.com.br
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            # traefik vem embutido no k3s; não é instalado por este repositório.
            ingressClassName: traefik
