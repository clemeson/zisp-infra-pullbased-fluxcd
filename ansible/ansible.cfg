[defaults]
inventory          = ./inventory.sh
roles_path         = ./roles
stdout_callback    = yaml
interpreter_python = /usr/bin/python3

# Mostra o diff do que mudou em cada arquivo — é o que torna um playbook
# auditável: dá pra rodar com --check --diff e ver a mudança sem aplicar.
diff_always = True

[privilege_escalation]
become        = True
become_method = sudo
become_ask_pass = False

[ssh_connection]
# accept-new em vez de no: aceita a chave no primeiro contato (a VM é nova a
# cada terraform apply) mas FALHA se a chave mudar depois — que é o caso que
# importa de verdade. "StrictHostKeyChecking=no" aceitaria qualquer troca.
ssh_args = -o StrictHostKeyChecking=accept-new -o ControlMaster=auto -o ControlPersist=60s

# Reduz round-trips de SSH por tarefa. Funciona porque a imagem Ubuntu da
# Azure não usa `requiretty` no sudoers.
pipelining = True
