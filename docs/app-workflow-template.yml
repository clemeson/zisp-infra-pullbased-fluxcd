# Build de APP_NAME: publica uma imagem no ECR.
# Autenticação AWS por OIDC, restrita à main deste repositório.
# O Flux detecta a nova tag e atualiza o zisp-infra; o CI não acessa o cluster.
name: Build APP_NAME

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 532295959828.dkr.ecr.us-east-1.amazonaws.com

concurrency:
  group: APP_NAME-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Obter credenciais AWS temporárias
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::532295959828:role/zisp-github-ecr-push
          aws-region: us-east-1

      - name: Login no ECR
        run: |
          set -euo pipefail
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Build e push
        run: |
          set -euo pipefail
          # <timestamp>-<sha curto>. O timestamp dá ordem numérica para a
          # ImagePolicy do Flux; o sha responde "qual commit está no ar?",
          # que é a primeira pergunta de todo incidente. Tag só com sha não
          # ordena; tag só com data não identifica.
          TAG="$(date -u +%s)-${GITHUB_SHA::7}"
          IMAGE="$ECR_REGISTRY/APP_NAME"

          docker build -t "$IMAGE:$TAG" .
          docker push "$IMAGE:$TAG"

          echo "$IMAGE:$TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "O Flux detecta em até 5 min e commita a tag no zisp-infra." >> "$GITHUB_STEP_SUMMARY"
