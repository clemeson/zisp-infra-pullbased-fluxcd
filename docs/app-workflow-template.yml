# Molde do .github/workflows/build.yml de uma aplicação ZISP.
#
# JÁ APLICADO nos três repos (zisp-api, zisp-vpn-api, zisp-super-api).
# Fica aqui como referência e para a próxima aplicação.
#
# Copie para o repo da aplicação e troque APP_NAME. Depois, no repo novo:
#   Secrets:   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
#   Variables: AWS_REGION, ECR_REGISTRY
# E crie o repositório no ECR -- o push NÃO cria (ver README, seção ECR).
#
# O CI faz UMA coisa: publicar a imagem. Quem descobre a tag nova e atualiza
# o cluster é o Flux (clusters/production/images.yaml). O repo da aplicação
# não sabe que o zisp-infra existe, e não tem credencial para o cluster.
#
#   deploy.yml antigo                       este molde
#   --------------------------------------  --------------------------------
#   AWS_ACCESS_KEY_ID / _SECRET_ACCESS_KEY  AWS_ACCESS_KEY_ID / _SECRET
#   AWS_REGION como secret                  Variable (visível na UI)
#   VPS_HOST / VPS_USER / VPS_PASSWORD      - (o CI não toca o cluster)
#   KUBECONFIG_B64                          -
#   INFRA_TOKEN / PAT_TOKEN                 - (o Flux commita, não o CI)
#   8 secrets                               2
#
# O QUE O ECR CUSTA AQUI, dito às claras: estes dois secrets. O GHCR
# autenticava com o GITHUB_TOKEN do run e deixava os repos de aplicação com
# ZERO secrets -- foi a única vantagem real dele, e ela se perde. A troca foi
# deliberada (ver README): o ECR tira o GitHub de ser ponto único de falha de
# git + CI + registry, e reaproveita credencial que já existe para o S3.
#
# O passo seguinte, quando quiser: federação OIDC GitHub -> AWS, que devolve o
# zero-secret sem voltar ao GHCR. Troca estes dois secrets por uma role.
#
# O ecr-refresh.yml antigo NÃO volta. Ele era um workflow que entrava na VPS
# por sshpass com a senha de root para recriar o pull secret. Quem renova
# agora é um CronJob dentro do cluster, declarativo e em git
# (zisp-infra/infrastructure/ecr-refresh.yaml). O cron nunca foi o problema;
# o sshpass era.
name: Build APP_NAME

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: APP_NAME-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Login por shell em vez de aws-actions/configure-aws-credentials +
      # amazon-ecr-login: `aws` e `docker` já vêm no runner, e são duas ações
      # de terceiros a menos no caminho de um build que publica artefato.
      #
      # A senha entra por STDIN. Na linha de comando ela apareceria no log.
      - name: Login no ECR
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
        run: |
          set -euo pipefail
          : "${ECR_REGISTRY:?defina a variable ECR_REGISTRY}"
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Build e push
        env:
          ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
        run: |
          set -euo pipefail
          # <timestamp>-<sha curto>. O timestamp dá ordem numérica para a
          # ImagePolicy do Flux; o sha responde "qual commit está no ar?",
          # que é a primeira pergunta de todo incidente. Tag só com sha não
          # ordena; tag só com data não identifica.
          TAG="$(date -u +%s)-${GITHUB_SHA::7}"
          IMAGE="$ECR_REGISTRY/APP_NAME"

          docker build -t "$IMAGE:$TAG" .
          docker push "$IMAGE:$TAG"

          echo "$IMAGE:$TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "O Flux detecta em até 5 min e commita a tag no zisp-infra." >> "$GITHUB_STEP_SUMMARY"
