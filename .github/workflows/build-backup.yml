# Imagem usada pelos três CronJobs de backup. Vive neste repositório porque
# é infraestrutura, não aplicação: pg_dump, redis-cli e aws-cli numa camada
# só, com versão fixa em vez de `apk add` no caminho crítico do backup.
#
# Gerado a partir de docs/app-workflow-template.yml.
name: Build zisp-backup

on:
  push:
    branches: [main]
    paths:
      - images/backup/**
      - .github/workflows/build-backup.yml
  workflow_dispatch:

# `packages: write` saiu junto com o GHCR: este workflow não publica mais em
# registry do GitHub, e o GITHUB_TOKEN não autentica no ECR.
permissions:
  contents: read

concurrency:
  group: zisp-backup-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Login por shell em vez de aws-actions/configure-aws-credentials +
      # amazon-ecr-login: `aws` e `docker` já vêm no runner, e são duas ações
      # de terceiros a menos no caminho de um build que publica artefato.
      #
      # A senha entra por STDIN (`--password-stdin`). Na linha de comando ela
      # apareceria no log do runner e em `ps`.
      - name: Login no ECR
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
        run: |
          set -euo pipefail
          : "${ECR_REGISTRY:?defina a variable ECR_REGISTRY}"
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Build e push
        env:
          ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
        run: |
          set -euo pipefail
          # <timestamp>-<sha curto>. O timestamp dá ordem numérica para a
          # ImagePolicy do Flux; o sha responde "qual commit está no ar?",
          # que é a primeira pergunta de todo incidente. Tag só com sha não
          # ordena; tag só com data não identifica.
          TAG="$(date -u +%s)-${GITHUB_SHA::7}"
          IMAGE="$ECR_REGISTRY/zisp-backup"

          docker build -t "$IMAGE:$TAG" images/backup
          docker push "$IMAGE:$TAG"

          echo "$IMAGE:$TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "O Flux detecta em até 5 min e commita a tag no zisp-infra." >> "$GITHUB_STEP_SUMMARY"
